services:
  mysql:
    container_name: gpw-mysql
    restart: always
    image: mysql:8
    command:
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
      - --performance-schema=OFF
    env_file:
      - ./config/secure/docker.env
    ports:
      - "3309:3306"
    networks:
      - gpw-network
    volumes:
      - ./.docker-volumes/mysql:/var/lib/mysql

networks:
  gpw-network:
    external: true
