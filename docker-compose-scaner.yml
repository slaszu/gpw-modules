version: '3'
services:
  app-scaner:
    container_name: gpw-app-scaner
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      APP_TEMP_DIR: /app-data
      spring_profiles_active: prod
    networks:
      - gpw-network
    volumes:
      - ./.docker-volumes/app-data:/app-data
      - ./scaner-github-release.jar:/app-build/scaner-prod.jar
    entrypoint: java -jar /app-build/scaner-prod.jar

networks:
  gpw-network:
    external: true